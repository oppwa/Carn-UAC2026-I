<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard X Total Entregados 2026-I</title>
    <style>
        :root {
            --primary: #1a73e8;
            --success: #34a853;
            --danger: #ea4335;
            --bg: #f4f7f6;
            --text: #333;
            --card-bg: #fff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); margin: 0; }
        .header p { color: #666; font-size: 0.9em; }
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .kpi-card.entregados { border-left-color: var(--success); }
        .kpi-card.faltantes { border-left-color: var(--danger); }
        .kpi-title { font-size: 0.9em; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .kpi-value { font-size: 2em; font-weight: bold; margin: 10px 0 0 0; color: var(--text); }
        .table-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            background-color: #f8f9fa;
            color: #333;
            padding: 12px;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            position: sticky;
            top: 0;
        }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #f1f3f4; }
        .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 10px; height: 8px; margin-top: 5px; }
        .progress-fill { height: 8px; border-radius: 10px; background-color: var(--success); }
        .search-box {
            margin-bottom: 15px;
            padding: 10px;
            width: 100%;
            max-width: 300px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        .loading { text-align: center; font-size: 1.2em; color: var(--primary); }
        .foot { color: #666; font-size: 0.85em; margin-top: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Dashboard de Entregas 2026-I</h1>
        <p>Carnés entregados por Escuela</p>
    </div>

    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-title">Total Carnés</div>
            <div class="kpi-value" id="totalCarnes">Cargando...</div>
        </div>
        <div class="kpi-card entregados">
            <div class="kpi-title">Total Entregados</div>
            <div class="kpi-value" id="totalEntregados">Cargando...</div>
        </div>
        <div class="kpi-card faltantes">
            <div class="kpi-title">Total Faltantes</div>
            <div class="kpi-value" id="totalFaltantes">Cargando...</div>
        </div>
    </div>

    <div class="table-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar escuela...">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Escuela</th>
                    <th>Carné Entregados</th>
                    <th>Total Carnés</th>
                    <th>Carné Faltantes</th>
                    <th>Progreso</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" class="loading">Cargando datos...</td></tr>
            </tbody>
        </table>
        
    </div>

    <script>
        // Datos incluidos directamente en el archivo (no se carga nada externo)
        const DATA = [
            {"escuela": "ADMINISTRACIÓN", "entregados": 184, "total": 246, "faltantes": 62},
            {"escuela": "ADMINISTRACIÓN DE NEGOCIOS INTERNACIONALES", "entregados": 135, "total": 271, "faltantes": 136},
            {"escuela": "ARQUITECTURA", "entregados": 581, "total": 706, "faltantes": 125},
            {"escuela": "CONTABILIDAD", "entregados": 207, "total": 235, "faltantes": 28},
            {"escuela": "DERECHO", "entregados": 1369, "total": 1635, "faltantes": 266},
            {"escuela": "ECONOMÍA", "entregados": 457, "total": 526, "faltantes": 69},
            {"escuela": "EDUCACIÓN", "entregados": 297, "total": 312, "faltantes": 15},
            {"escuela": "ENFERMERÍA", "entregados": 364, "total": 402, "faltantes": 38},
            {"escuela": "ESCUELA DE POSGRADO", "entregados": 0, "total": 26, "faltantes": 26},
            {"escuela": "ESTOMATOLOGÍA", "entregados": 353, "total": 409, "faltantes": 56},
            {"escuela": "FINANZAS", "entregados": 38, "total": 38, "faltantes": 0},
            {"escuela": "INGENIERÍA AMBIENTAL", "entregados": 262, "total": 307, "faltantes": 45},
            {"escuela": "INGENIERÍA CIVIL", "entregados": 649, "total": 804, "faltantes": 155},
            {"escuela": "INGENIERÍA DE SISTEMAS", "entregados": 341, "total": 393, "faltantes": 52},
            {"escuela": "INGENIERÍA INDUSTRIAL", "entregados": 270, "total": 307, "faltantes": 37},
            {"escuela": "MARKETING", "entregados": 140, "total": 156, "faltantes": 16},
            {"escuela": "MEDICINA HUMANA", "entregados": 1068, "total": 1269, "faltantes": 201},
            {"escuela": "OBSTETRICIA", "entregados": 339, "total": 372, "faltantes": 33},
            {"escuela": "PSICOLOGÍA", "entregados": 698, "total": 797, "faltantes": 99},
            {"escuela": "PUERTO MALDONADO", "entregados": 8, "total": 213, "faltantes": 205},
            {"escuela": "QUILLABAMBA", "entregados": 55, "total": 295, "faltantes": 240},
            {"escuela": "SICUANI", "entregados": 58, "total": 113, "faltantes": 55},
            {"escuela": "TECNOLOGÍA MÉDICA", "entregados": 277, "total": 277, "faltantes": 0},
            {"escuela": "TURISMO", "entregados": 113, "total": 137, "faltantes": 24},
            {"escuela": "SEGUNDA ESPECIALIDAD", "entregados": 0, "total": 26, "faltantes": 26}
        ];
        // Totales oficiales de la fila TOTAL de la hoja
        const TOTAL = {entregados: 8263, total: 10246, faltantes: 1983};

        const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
        const fmt = n => n.toLocaleString('es-PE');

        let tableHTML = '';
        DATA.forEach(({escuela, entregados, total, faltantes}) => {
            const porcentaje = total > 0 ? Math.round((entregados / total) * 100) : 0;
            let colorBarra = 'var(--success)';
            if (porcentaje < 50) colorBarra = 'var(--danger)';
            else if (porcentaje < 80) colorBarra = '#fbbc04';

            tableHTML += `
                <tr>
                    <td><strong>${esc(escuela)}</strong></td>
                    <td>${fmt(entregados)}</td>
                    <td>${fmt(total)}</td>
                    <td style="color: ${faltantes > 0 ? 'var(--danger)' : 'var(--success)'}; font-weight: bold;">${fmt(faltantes)}</td>
                    <td>
                        <div style="font-size:0.8em; margin-bottom:2px;">${porcentaje}%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${porcentaje}%; background-color: ${colorBarra};"></div>
                        </div>
                    </td>
                </tr>`;
        });

        document.getElementById('totalCarnes').innerText = fmt(TOTAL.total);
        document.getElementById('totalEntregados').innerText = fmt(TOTAL.entregados);
        document.getElementById('totalFaltantes').innerText = fmt(TOTAL.faltantes);
        document.getElementById('tableBody').innerHTML = tableHTML;

        document.getElementById('searchInput').addEventListener('input', function () {
            const filter = this.value.toLowerCase();
            document.querySelectorAll('#dataTable tbody tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(filter) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
