<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard X Total Entregados 2026-I</title>
    <style>
        :root {
            --primary: #1a73e8;
            --success: #34a853;
            --danger: #ea4335;
            --bg: #f4f7f6;
            --text: #333;
            --card-bg: #fff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); margin: 0; }
        .header p { color: #666; font-size: 0.9em; }
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .kpi-card.entregados { border-left-color: var(--success); }
        .kpi-card.faltantes { border-left-color: var(--danger); }
        .kpi-title { font-size: 0.9em; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .kpi-value { font-size: 2em; font-weight: bold; margin: 10px 0 0 0; color: var(--text); }
        .table-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            background-color: #f8f9fa;
            color: #333;
            padding: 12px;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            position: sticky;
            top: 0;
        }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #f1f3f4; }
        .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 10px; height: 8px; margin-top: 5px; }
        .progress-fill { height: 8px; border-radius: 10px; background-color: var(--success); }
        .search-box {
            margin-bottom: 15px;
            padding: 10px;
            width: 100%;
            max-width: 300px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        .loading { text-align: center; font-size: 1.2em; color: var(--primary); }
        .foot { color: #666; font-size: 0.85em; margin-top: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Dashboard de Entregas 2026-I</h1>
        <p>Monitoreo de carnés entregados por Escuela</p>
    </div>

    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-title">Total Carnés</div>
            <div class="kpi-value" id="totalCarnes">Cargando...</div>
        </div>
        <div class="kpi-card entregados">
            <div class="kpi-title">Total Entregados</div>
            <div class="kpi-value" id="totalEntregados">Cargando...</div>
        </div>
        <div class="kpi-card faltantes">
            <div class="kpi-title">Total Faltantes</div>
            <div class="kpi-value" id="totalFaltantes">Cargando...</div>
        </div>
    </div>

    <div class="table-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar escuela...">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Escuela</th>
                    <th>Carné Entregados</th>
                    <th>Total Carnés</th>
                    <th>Carné Faltantes</th>
                    <th>Progreso</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" class="loading">Cargando datos...</td></tr>
            </tbody>
        </table>
        <p class="foot" id="foot"></p>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQyj0qnKCKF7cdQeOCZjiFCsONH-4TAH6Zv9us3COgMlbjhiu4zGw_-VzVZtmsl68SNxpRdoYav4Yf/pub?gid=0&single=true&output=csv';
        const REFRESH_MIN = 5; // actualización automática, en minutos

        // Lector de CSV que respeta comillas y nombres con espacios
        function parseCSV(text) {
            const out = []; let row = [], cur = '', q = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (q) {
                    if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
                    else if (c === '"') q = false;
                    else cur += c;
                } else if (c === '"') q = true;
                else if (c === ',') { row.push(cur); cur = ''; }
                else if (c === '\n') { row.push(cur); out.push(row); row = []; cur = ''; }
                else if (c !== '\r') cur += c;
            }
            if (cur || row.length) { row.push(cur); out.push(row); }
            return out;
        }

        const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

        async function fetchData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                processData(await response.text());
                document.getElementById('foot').textContent =
                    'Actualizado: ' + new Date().toLocaleString('es-PE') + ' · se actualiza solo cada ' + REFRESH_MIN + ' min';
            } catch (error) {
                console.error("Error al obtener datos:", error);
                document.getElementById('tableBody').innerHTML =
                    '<tr><td colspan="5" style="text-align:center; color:red;">Error al cargar los datos. Verifica el enlace CSV y que esté publicado sin restricción de organización.</td></tr>';
            }
        }

        function processData(csv) {
            const lines = parseCSV(csv).slice(1); // sin encabezados
            let totalEntregados = 0, totalCarnes = 0, totalFaltantes = 0;
            let sumE = 0, sumT = 0, sumF = 0;
            let tableHTML = '';

            for (const row of lines) {
                if (row.length < 4 || !row[0].trim()) continue;

                const escuela = row[0].trim();
                const entregados = parseInt(row[1]) || 0;
                const total = parseInt(row[2]) || 0;
                const faltantes = parseInt(row[3]) || 0;

                if (escuela.toUpperCase() === 'TOTAL') {
                    totalEntregados = entregados;
                    totalCarnes = total;
                    totalFaltantes = faltantes;
                    continue;
                }

                sumE += entregados; sumT += total; sumF += faltantes;

                const porcentaje = total > 0 ? Math.round((entregados / total) * 100) : 0;
                let colorBarra = 'var(--success)';
                if (porcentaje < 50) colorBarra = 'var(--danger)';
                else if (porcentaje < 80) colorBarra = '#fbbc04';

                tableHTML += `
                    <tr>
                        <td><strong>${esc(escuela)}</strong></td>
                        <td>${entregados.toLocaleString('es-PE')}</td>
                        <td>${total.toLocaleString('es-PE')}</td>
                        <td style="color: ${faltantes > 0 ? 'var(--danger)' : 'var(--success)'}; font-weight: bold;">${faltantes.toLocaleString('es-PE')}</td>
                        <td>
                            <div style="font-size:0.8em; margin-bottom:2px;">${porcentaje}%</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${porcentaje}%; background-color: ${colorBarra};"></div>
                            </div>
                        </td>
                    </tr>`;
            }

            // Si la hoja no trae fila TOTAL, se calcula sumando las escuelas
            if (!totalCarnes) { totalEntregados = sumE; totalCarnes = sumT; totalFaltantes = sumF; }

            document.getElementById('totalCarnes').innerText = totalCarnes.toLocaleString('es-PE');
            document.getElementById('totalEntregados').innerText = totalEntregados.toLocaleString('es-PE');
            document.getElementById('totalFaltantes').innerText = totalFaltantes.toLocaleString('es-PE');
            document.getElementById('tableBody').innerHTML = tableHTML;
            applyFilter();
        }

        function applyFilter() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#dataTable tbody tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(filter) ? '' : 'none';
            });
        }

        document.getElementById('searchInput').addEventListener('input', applyFilter);

        fetchData();
        setInterval(fetchData, REFRESH_MIN * 60 * 1000);
    </script>
</body>
</html>
