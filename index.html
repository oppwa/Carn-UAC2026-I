<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrega de carnés 2026-I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#14232b; --muted:#5b6d76; --line:#d5dee3;
  --done:#0f6b5c; --done-bg:#cfe7e1; --pending:#d98a1c; --pending-bg:#f6e3c3; --alert:#b3402a;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1a1f; --surface:#17262d; --ink:#e8eff2; --muted:#93a6ae; --line:#27393f;
  --done:#43b9a4; --done-bg:#1d3d39; --pending:#f0a840; --pending-bg:#43341b; --alert:#ef7f68;}
}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 64px}
h1{font:800 clamp(1.8rem,4vw,2.6rem)/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 28px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.hero-top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
.pct{font:800 clamp(2.6rem,7vw,4.2rem)/1 "Bricolage Grotesque",sans-serif;color:var(--done)}
.pct small{font:500 1rem Figtree;color:var(--muted);margin-left:8px}
.nums{display:flex;gap:28px;flex-wrap:wrap}
.nums div{min-width:90px}
.nums b{display:block;font:600 1.5rem "Bricolage Grotesque";font-variant-numeric:tabular-nums}
.nums span{color:var(--muted);font-size:.9rem}
.nums .miss b{color:var(--pending)}
.bar{height:14px;border-radius:7px;background:var(--pending-bg);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:var(--done)}

.tools{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 12px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input[type=search]{flex:1;min-width:200px}
:focus-visible{outline:3px solid var(--done);outline-offset:2px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(150px,1.6fr) 3fr 80px 80px;gap:8px 16px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font-weight:600}
.meter{height:10px;border-radius:5px;background:var(--pending-bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--done)}
.row.low .meter i{background:var(--alert)}
.v{text-align:right;font-variant-numeric:tabular-nums}
.v em{display:block;font-style:normal;color:var(--muted);font-size:.8rem}
.v.miss{color:var(--pending);font-weight:600}
.head{background:var(--bg);color:var(--muted);font-size:.85rem;padding-top:10px;padding-bottom:10px}
.msg{padding:28px 20px;color:var(--muted)}
.msg.err{color:var(--alert)}
.foot{color:var(--muted);font-size:.85rem;margin-top:14px}
@media(max-width:640px){
  .row{grid-template-columns:1fr 1fr;padding:14px 16px}
  .row .meter{grid-column:1/-1;order:3}
  .head{display:none}
  .v.miss{text-align:right}
}
</style>
</head>
<body>
<main class="wrap">
  <h1>Entrega de carnés 2026-I</h1>
  <p class="sub">Avance por escuela. Los datos vienen de tu Google Sheet.</p>

  <section class="hero" aria-live="polite">
    <div class="hero-top">
      <div class="pct"><span id="pct">–</span><small>entregado</small></div>
      <div class="nums">
        <div><b id="sumDone">–</b><span>Entregados</span></div>
        <div class="miss"><b id="sumMiss">–</b><span>Faltantes</span></div>
        <div><b id="sumTotal">–</b><span>Total</span></div>
      </div>
    </div>
    <div class="bar" role="progressbar" aria-label="Avance total" aria-valuemin="0" aria-valuemax="100"><i id="barFill" style="width:0"></i></div>
  </section>

  <div class="tools">
    <input id="q" type="search" placeholder="Buscar escuela" aria-label="Buscar escuela">
    <select id="sort" aria-label="Ordenar por">
      <option value="falt">Más faltantes primero</option>
      <option value="pct">Menor avance primero</option>
      <option value="name">Nombre (A–Z)</option>
      <option value="done">Más entregados primero</option>
    </select>
  </div>

  <div class="list" id="list"><div class="msg">Cargando datos…</div></div>
  <p class="foot" id="foot"></p>
</main>

<script>
// 1) Pega aquí la URL de tu implementación de Apps Script (termina en /exec)
const API_URL = 'https://docs.google.com/spreadsheets/d/13vPx_Jx_QK23vfEkfS8oEjtFFl9nt-c0S4NWliyrd4Y/edit?gid=0#gid=0';
// 2) Si definiste TOKEN en Code.gs, ponlo igual aquí
const TOKEN = '';

const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat('es-PE');
let rows = [];

async function load(){
  if(!API_URL){ show('Falta configurar API_URL en index.html con la URL de tu Apps Script.', true); return; }
  try{
    const res = await fetch(API_URL + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : ''));
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Respuesta inválida');
    rows = data.rows;
    $('foot').textContent = 'Actualizado: ' + new Date(data.updated).toLocaleString('es-PE');
    render();
  }catch(err){
    show('No se pudieron cargar los datos (' + err.message + '). Revisa que la implementación sea pública y que la URL sea la correcta.', true);
  }
}

function show(text, isErr){ $('list').innerHTML = '<div class="msg' + (isErr ? ' err' : '') + '">' + text + '</div>'; }
const pctOf = r => r.total ? r.entregados / r.total : 1;

function render(){
  const sum = rows.reduce((a, r) => ({d: a.d + r.entregados, t: a.t + r.total, f: a.f + r.faltantes}), {d:0, t:0, f:0});
  const p = sum.t ? sum.d / sum.t * 100 : 0;
  $('pct').textContent = p.toFixed(1) + '%';
  $('sumDone').textContent = nf.format(sum.d);
  $('sumMiss').textContent = nf.format(sum.f);
  $('sumTotal').textContent = nf.format(sum.t);
  $('barFill').style.width = p + '%';
  document.querySelector('.bar').setAttribute('aria-valuenow', p.toFixed(1));

  const q = $('q').value.trim().toLowerCase();
  const sorters = {
    falt: (a,b) => b.faltantes - a.faltantes,
    pct: (a,b) => pctOf(a) - pctOf(b),
    name: (a,b) => a.escuela.localeCompare(b.escuela, 'es'),
    done: (a,b) => b.entregados - a.entregados
  };
  const view = rows.filter(r => r.escuela.toLowerCase().includes(q)).sort(sorters[$('sort').value]);
  if(!view.length){ show('Ninguna escuela coincide con tu búsqueda.'); return; }

  $('list').innerHTML =
    '<div class="row head"><span>Escuela</span><span>Avance</span><span class="v">Entregados</span><span class="v">Faltan</span></div>' +
    view.map(r => {
      const pc = pctOf(r) * 100;
      return '<div class="row' + (pc < 50 ? ' low' : '') + '">' +
        '<span class="name">' + esc(r.escuela) + '</span>' +
        '<div class="meter" role="img" aria-label="' + pc.toFixed(0) + '% entregado"><i style="width:' + pc + '%"></i></div>' +
        '<span class="v">' + nf.format(r.entregados) + '<em>de ' + nf.format(r.total) + ' · ' + pc.toFixed(0) + '%</em></span>' +
        '<span class="v miss">' + nf.format(r.faltantes) + '</span></div>';
    }).join('');
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('q').addEventListener('input', render);
$('sort').addEventListener('change', render);
load();
</script>
</body>
</html>
